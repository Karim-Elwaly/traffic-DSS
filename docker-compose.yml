services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: it_dss_backend
    ports:
      - "8765:8765"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: it_dss_frontend
    ports:
      - "5199:5199"
    environment:
      - VITE_API_PROXY_TARGET=http://backend:8765
    depends_on:
      - backend
    restart: unless-stopped
